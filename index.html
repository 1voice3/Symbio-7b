<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Symbio 700 Sim">
<meta name="theme-color" content="#14181f">
<meta name="description" content="Educational HVAC simulator based on the Symbio 700 Information & Troubleshooting Manual">
<title>Symbio 700 HVAC Simulator</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#14181f; --bg2:#1b212b; --card:#202836; --card2:#26303f;
  --line:#323e50; --txt:#e8edf4; --mut:#93a1b5; --dim:#5c6b80;
  --red:#e5484d; --amber:#f5a623; --blue:#3b82f6; --cyan:#22d3ee; --green:#2fbf71; --purple:#a78bfa;
  --manual:#f0b429;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;position:relative}
header#topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line);z-index:30}
header#topbar .title{flex:1;min-width:0}
header#topbar .title .crumb{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header#topbar .title .t{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative}
.iconbtn:active{background:var(--card2)}
.iconbtn svg{width:20px;height:20px;fill:currentColor}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
.badge.show{display:flex}
main#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 90px}
nav#tabbar{flex:0 0 auto;position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav#tabbar button{flex:1;background:none;border:none;color:var(--mut);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;cursor:pointer}
nav#tabbar button svg{width:22px;height:22px;fill:currentColor}
nav#tabbar button.on{color:var(--cyan)}
.crumbbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.crumbbar .c{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer}
.crumbbar .c.on{color:var(--cyan);border-color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.card .hd .n{flex:1;font-weight:700;font-size:15px}
.card .hd .sub{font-size:11px;color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--card2)}
.row .nm{flex:1;min-width:0;font-size:14px}
.row .nm .note{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.row .vl{font-size:14px;font-weight:700;color:var(--cyan);text-align:right;white-space:nowrap}
.row .vl.on{color:var(--green)} .row .vl.off{color:var(--dim)} .row .vl.warn{color:var(--amber)} .row .vl.alarm{color:var(--red)}
.row .vl.edit{color:var(--purple)}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(240,180,41,.14);color:var(--manual);border:1px solid rgba(240,180,41,.4);border-radius:12px;font-size:11px;font-weight:700;padding:3px 9px;cursor:pointer;white-space:nowrap}
.pill:active{background:rgba(240,180,41,.3)}
.hero{display:flex;align-items:baseline;gap:12px;padding:16px}
.hero .big{font-size:44px;font-weight:800;line-height:1}
.hero .unit{font-size:16px;color:var(--mut)}
.hero .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.leds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.led{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.led .k{font-size:11px;color:var(--mut);font-weight:700}
.led .v{font-size:12px;font-weight:800;margin-top:3px}
.led .v.on{color:var(--green)} .led .v.off{color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .k{font-size:11px;color:var(--mut)}
.tile .v{font-size:18px;font-weight:800;margin-top:2px}
.tile .v small{font-size:11px;color:var(--mut);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;padding:11px 18px;cursor:pointer;width:100%}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.amber{background:var(--amber);color:#1c1400}
.btn.small{width:auto;padding:8px 14px;font-size:13px}
.btnrow{display:flex;gap:8px;padding:12px}
.btnrow .btn{flex:1}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);transition:.2s;flex:0 0 auto;cursor:pointer}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:22px}
input[type=range]{width:100%;accent-color:var(--cyan)}
select,input[type=text],input[type=number]{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modalbg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal .mh{font-size:16px;font-weight:800;margin-bottom:4px}
.modal .ms{font-size:12px;color:var(--mut);margin-bottom:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 18px;font-size:13px;z-index:90;display:none;max-width:85%;text-align:center}
.toast.show{display:block}
/* search */
#searchwrap{position:fixed;inset:0;background:rgba(10,13,18,.92);z-index:70;display:none;flex-direction:column;max-width:760px;margin:0 auto}
#searchwrap.show{display:flex}
#searchwrap .stop{padding:12px;padding-top:max(12px,env(safe-area-inset-top));display:flex;gap:8px}
#searchwrap input{flex:1;font-size:16px}
#searchresults{flex:1;overflow-y:auto;padding:0 12px 30px}
.sgroup{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.sres .rt{font-size:14px;font-weight:700}
.sres .rp{font-size:12px;color:var(--mut);margin-top:3px}
.sres .rx{font-size:12px;color:var(--mut);margin-top:5px}
.sres .rx b{color:var(--amber);font-weight:700}
.sres .racts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.sres .racts .btn{width:auto;padding:7px 13px;font-size:12px}
.pathchip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--cyan)}
.pathchip span+span::before{content:" › ";color:var(--dim)}
/* manual viewer */
#manualview{position:fixed;inset:0;background:#0c0f14;z-index:80;display:none;flex-direction:column}
#manualview.show{display:flex}
#manualview .mtop{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line)}
#manualview .mtop .back{background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 14px;cursor:pointer;white-space:nowrap}
#manualview .mtop .pg{flex:1;text-align:center;font-size:13px;color:var(--mut)}
#manualview .mtop .pg input{width:64px;text-align:center;padding:6px}
#manualview .mpage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#3a3f47;padding:14px}
#manualview .mcanvaswrap{position:relative;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.5)}
#manualview canvas{display:block;border-radius:3px}
#manualview .mlayer{position:absolute;inset:0;overflow:hidden;border-radius:3px}
#manualview .mlayer span{position:absolute;color:transparent;cursor:text;white-space:pre;transform-origin:0 0}
#manualview mark{background:rgba(255,214,0,.55);color:transparent;border-radius:2px;box-shadow:0 0 0 1px rgba(255,214,0,.8)}
#manualview mark.pulse{animation:pulse 1.2s ease 3}
@keyframes pulse{0%,100%{background:rgba(255,214,0,.55)}50%{background:rgba(255,120,0,.85)}}
#manualview .mbar{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
#manualview .mbar button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer}
#manualview .mbar button:active{background:var(--card2)}
#manualview .mnote{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;z-index:5;display:none}
/* alarms */
.alarm{border-left:4px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.alarm.crit{border-left-color:var(--red)} .alarm.svc{border-left-color:var(--amber)} .alarm.adv{border-left-color:var(--blue)} .alarm.info{border-left-color:var(--cyan)}
.alarm .an{font-weight:700;font-size:14px}
.alarm .ad{font-size:11px;color:var(--mut);margin-top:2px}
.alarm .at{font-size:11px;font-weight:700;margin-top:3px}
.alarm.crit .at{color:var(--red)} .alarm.svc .at{color:var(--amber)} .alarm.adv .at{color:var(--blue)} .alarm.info .at{color:var(--cyan)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 8px}
.note{font-size:11px;color:var(--dim);padding:10px 14px;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--mut)}
.kv .v{font-weight:700;text-align:right}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:16px 2px 8px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="iconbtn" id="btnBack" aria-label="Back" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M15.5 19l-7-7 7-7V5l-9 9 9 9v-1z"/></svg>
    </button>
    <div class="title"><div class="crumb" id="hdrCrumb">Symbio™ 700</div><div class="t" id="hdrTitle">HVAC Simulator</div></div>
    <button class="iconbtn" id="btnSearch" aria-label="Search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    </button>
    <button class="iconbtn" id="btnTrainer" aria-label="Simulator controls">
      <svg viewBox="0 0 24 24"><path d="M4 8h10v2H4V8zm0 6h10v2H4v-2zM18 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-2v9h-5v-6h-4v6H5v-9H3l9-8z"/></svg>Home</button>
    <button data-tab="status"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3v-8zm7-9h4v17h-4V4zm7 5h4v12h-4V9z"/></svg>Status</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a7.6 7.6 0 0 0-1.7-1L14.5 3.4a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4L9.1 6a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.7L4.5 11a7.8 7.8 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.4.5.4h4c.3 0 .5-.1.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.7L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>Settings</button>
    <button data-tab="service"><svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1a5.5 5.5 0 0 0-7.8-7.8L9 5.3 5.3 9 2 5.7a5.5 5.5 0 0 0 7.8 7.8L19 22.7a1 1 0 0 0 1.4 0l2.3-2.3a1 1 0 0 0 0-1.4z"/></svg>Service</button>
    <button data-tab="alarms"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-4.5-5.8V4.5a1.5 1.5 0 0 0-3 0v.7A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>Alarms<span class="badge" id="alarmBadge">0</span></button>
    <button data-tab="utilities"><svg viewBox="0 0 24 24"><path d="M16.5 3C14 3 12 5 12 7.5c0 1.5.7 2.8 1.8 3.7L4 20l1.5 1.5L8 19h3l1.5-1.5-2-2 2-2 2 2 1.5-1.5c.9 1.1 2.2 1.8 3.5 1.8a4.5 4.5 0 1 0 0-9zM17 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>Utilities</button>
  </nav>
</div>

<div id="searchwrap">
  <div class="stop">
    <input id="searchInput" type="text" placeholder="Search the manual & menus (e.g. compressor proving, defrost, alarms)" autocomplete="off">
    <button class="iconbtn" id="searchClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4z"/></svg>
    </button>
  </div>
  <div id="searchresults"></div>
</div>

<div id="manualview">
  <div class="mtop">
    <button class="back" id="mBack">‹ Simulator</button>
    <div class="pg"><button class="iconbtn" id="mPrev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15.5 19l-7-7 7-7V5l-9 9 9 9v-1z"/></svg></button>
    &nbsp;<input type="number" id="mPageInput" min="1" max="225"> / 225&nbsp;
    <button class="iconbtn" id="mNext" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M8.5 5l7 7-7 7v1l9-9-9-9v1z"/></svg></button></div>
    <button class="iconbtn" id="mOpenPdf" aria-label="Open PDF">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
    </button>
  </div>
  <div class="mnote" id="mNote"></div>
  <div class="mpage" id="mPage">
    <div class="mcanvaswrap" id="mWrap">
      <canvas id="mCanvas"></canvas>
      <div class="mlayer" id="mLayer"></div>
    </div>
  </div>
  <div class="mbar">
    <button id="mZoomOut">− Zoom</button>
    <button id="mFindPrev">▲ Find</button>
    <button id="mFindNext">▼ Find</button>
    <button id="mZoomIn">Zoom +</button>
  </div>
</div>

<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="pdf.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
